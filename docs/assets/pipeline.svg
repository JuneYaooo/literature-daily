<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">literature-daily 工作流程</title>
  <desc id="d">你的关键词和研究方向 → 脚本抓取 PubMed 新文献并去重 → Agent 对照研究方向分档、写中文导读 → 校验后输出 markdown 日报并标记已读</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9DB5AB"/>
    </marker>
  </defs>
  <rect width="1200" height="320" fill="#FAF8F3"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <!-- 1 -->
    <g transform="translate(40 60)">
      <rect width="240" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DE"/>
      <circle cx="40" cy="44" r="20" fill="#E7F1EC"/>
      <text x="40" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#2E6E5C">1</text>
      <text x="72" y="51" font-size="20" font-weight="700" fill="#10241E">告诉它你关心什么</text>
      <text x="24" y="104" font-size="15" fill="#4A5A53">· 关键词 / PubMed 检索式</text>
      <text x="24" y="134" font-size="15" fill="#4A5A53">· 一段研究方向描述</text>
      <text x="24" y="164" font-size="15" fill="#4A5A53">· 每词每期最多几篇</text>
    </g>
    <line x1="290" y1="160" x2="328" y2="160" stroke="#9DB5AB" stroke-width="3" marker-end="url(#a)"/>
    <!-- 2 -->
    <g transform="translate(340 60)">
      <rect width="240" height="200" rx="16" fill="#FFFFFF" stroke="#DCE3DE"/>
      <circle cx="40" cy="44" r="20" fill="#E7F1EC"/>
      <text x="40" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#2E6E5C">2</text>
      <text x="72" y="51" font-size="20" font-weight="700" fill="#10241E">脚本抓新文献</text>
      <text x="24" y="104" font-size="15" fill="#4A5A53">· 按 PubMed 入库时间取新</text>
      <text x="24" y="134" font-size="15" fill="#4A5A53">· 跳过读过的，超量顺延</text>
      <text x="24" y="164" font-size="15" fill="#4A5A53">· 拼错 / 被改写的检索式告警</text>
    </g>
    <line x1="590" y1="160" x2="628" y2="160" stroke="#9DB5AB" stroke-width="3" marker-end="url(#a)"/>
    <!-- 3 -->
    <g transform="translate(640 60)">
      <rect width="240" height="200" rx="16" fill="#173A31"/>
      <circle cx="40" cy="44" r="20" fill="#2A5246"/>
      <text x="40" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#BFEAD2">3</text>
      <text x="72" y="51" font-size="20" font-weight="700" fill="#F5F1E6">Agent 读摘要</text>
      <text x="24" y="104" font-size="15" fill="#CFE4DA">· 对照研究方向分三档</text>
      <text x="24" y="134" font-size="15" fill="#CFE4DA">· 每篇一句中文导读</text>
      <text x="24" y="164" font-size="15" fill="#CFE4DA">· 写明为什么值得读</text>
    </g>
    <line x1="890" y1="160" x2="928" y2="160" stroke="#9DB5AB" stroke-width="3" marker-end="url(#a)"/>
    <!-- 4 -->
    <g transform="translate(940 60)">
      <rect width="220" height="200" rx="16" fill="#E8734A"/>
      <circle cx="40" cy="44" r="20" fill="#F29A78"/>
      <text x="40" y="51" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
      <text x="72" y="51" font-size="20" font-weight="700" fill="#FFFFFF">日报落盘</text>
      <text x="24" y="104" font-size="15" fill="#FFF1EA">· 拒绝照抄摘要原文</text>
      <text x="24" y="134" font-size="15" fill="#FFF1EA">· 撤稿 / 勘误打标</text>
      <text x="24" y="164" font-size="15" fill="#FFF1EA">· 写成功后才记为已读</text>
    </g>
    <text x="600" y="298" text-anchor="middle" font-size="14" fill="#8A9690">全部在本机完成 · 日报只含导读、链接与元数据</text>
  </g>
</svg>

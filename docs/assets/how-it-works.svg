<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">它怎么工作</title>
  <desc id="desc">新文献从 PubMed 流出，经过去重漏斗，被 Agent 分进必读、值得扫一眼、可跳过三个托盘，校验通过后落盘成日报并写入已读名单；顺延的文献下次再来。</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F1EEE4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9FDCC4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9FDCC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F8B79C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F8B79C" stop-opacity="0"/>
    </radialGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1C3A31" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1C3A31" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1C3A31" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4F5EC"/><stop offset="1" stop-color="#CDEBDD"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5EEFB"/><stop offset="1" stop-color="#CFDDF4"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E2F3F1"/><stop offset="1" stop-color="#C6E6E1"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDEBE3"/><stop offset="1" stop-color="#F8D5C6"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEAFB"/><stop offset="1" stop-color="#DCD3F3"/></linearGradient>
    <linearGradient id="funnelG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CC0A6"/><stop offset="1" stop-color="#2A8B73"/></linearGradient>
    <linearGradient id="dbG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3F6FC6"/><stop offset="1" stop-color="#5A8BE0"/></linearGradient>
    <linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8D74E0"/><stop offset="1" stop-color="#6A52C4"/></linearGradient>
    <g id="sheet">
      <rect width="30" height="38" rx="4" fill="#FFFFFF" stroke="#D6DDD9"/>
      <rect x="5" y="6" width="14" height="3" rx="1.5" fill="#2E6E5C"/>
      <rect x="5" y="13" width="20" height="2.4" rx="1.2" fill="#CBD5D0"/>
      <rect x="5" y="18.5" width="17" height="2.4" rx="1.2" fill="#CBD5D0"/>
      <rect x="5" y="24" width="19" height="2.4" rx="1.2" fill="#CBD5D0"/>
    </g>
    <g id="chev">
      <circle r="15" fill="#FFFFFF" stroke="#DCE3DF"/>
      <path d="M-4 -6 l6 6 l-6 6" fill="none" stroke="#2E6E5C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1280" height="700" rx="28" fill="url(#bgGrad)"/>
  <circle cx="120" cy="80" r="260" fill="url(#glowA)"/>
  <circle cx="1180" cy="640" r="280" fill="url(#glowB)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <!-- header -->
    <text x="40" y="66" font-size="30" font-weight="800" fill="#173A31">它怎么工作</text>
    <text x="40" y="98" font-size="15.5" fill="#5F7069">一次真实运行：3 个脓毒症关键词，每词每期最多 6 篇，看最近 7 天</text>
    <g transform="translate(1040 46)">
      <rect width="200" height="36" rx="18" fill="#FFFFFF" stroke="#DCE3DF"/>
      <circle cx="20" cy="18" r="5" fill="#2E8A68"/>
      <text x="34" y="23.5" font-size="13.5" fill="#3E5149">全部在本机运行</text>
    </g>

    <!-- ========== card 1 ========== -->
    <g transform="translate(40 128)">
      <rect width="220" height="352" rx="20" fill="#FFFFFF" filter="url(#card)"/>
      <rect x="10" y="10" width="200" height="164" rx="14" fill="url(#g1)"/>
      <!-- clipboard -->
      <g transform="translate(46 30)" filter="url(#soft)">
        <rect width="128" height="130" rx="10" fill="#FFFFFF"/>
        <rect x="40" y="-8" width="48" height="18" rx="6" fill="#2E8A68"/>
        <circle cx="64" cy="1" r="3" fill="#FFFFFF"/>
        <g font-family="'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="600">
          <rect x="10" y="22" width="108" height="18" rx="9" fill="#E4F5EC"/><text x="64" y="34.5" text-anchor="middle" fill="#1F6E55">sepsis biomarker</text>
          <rect x="10" y="45" width="108" height="18" rx="9" fill="#E4F5EC"/><text x="64" y="57.5" text-anchor="middle" fill="#1F6E55">machine learning…</text>
          <rect x="10" y="68" width="108" height="18" rx="9" fill="#E4F5EC"/><text x="64" y="80.5" text-anchor="middle" fill="#1F6E55">early warning score</text>
        </g>
        <rect x="10" y="96" width="14" height="14" rx="4" fill="#F2C14E"/>
        <rect x="30" y="98" width="76" height="4" rx="2" fill="#D5DDD9"/>
        <rect x="30" y="106" width="58" height="4" rx="2" fill="#D5DDD9"/>
      </g>
      <circle cx="30" cy="30" r="16" fill="#2E8A68"/><text x="30" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">1</text>
      <text x="20" y="208" font-size="18" font-weight="800" fill="#173A31">说清你关心什么</text>
      <text x="20" y="238" font-size="13.5" fill="#5F7069">几个关键词或 PubMed 检索式</text>
      <text x="20" y="260" font-size="13.5" fill="#5F7069">外加一段研究方向描述</text>
      <text x="20" y="282" font-size="13.5" fill="#5F7069">（分档的唯一依据）</text>
      <rect x="20" y="304" width="180" height="32" rx="10" fill="#E4F5EC"/>
      <text x="110" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1F6E55">3 个词 × 每期 6 篇</text>
    </g>
    <use href="#chev" x="272.5" y="220"/>

    <!-- ========== card 2 ========== -->
    <g transform="translate(285 128)">
      <rect width="220" height="352" rx="20" fill="#FFFFFF" filter="url(#card)"/>
      <rect x="10" y="10" width="200" height="164" rx="14" fill="url(#g2)"/>
      <!-- database -->
      <g transform="translate(36 52)" filter="url(#soft)">
        <path d="M0 12 v70 a40 12 0 0 0 80 0 v-70" fill="url(#dbG)"/>
        <ellipse cx="40" cy="12" rx="40" ry="12" fill="#86A9EC"/>
        <path d="M0 36 a40 12 0 0 0 80 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
        <path d="M0 60 a40 12 0 0 0 80 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
        <text x="40" y="54" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">PubMed</text>
      </g>
      <!-- papers flying out -->
      <use href="#sheet" transform="translate(126 28) rotate(-10)" opacity="0.6"/>
      <use href="#sheet" transform="translate(146 64) rotate(6)" opacity="0.85"/>
      <use href="#sheet" transform="translate(130 110) rotate(-4)"/>
      <path d="M118 66 q 10 -8 18 -10" fill="none" stroke="#3F6FC6" stroke-width="2" stroke-dasharray="2 4" stroke-linecap="round"/>
      <!-- clock badge -->
      <g transform="translate(176 36)">
        <circle r="14" fill="#FFFFFF" stroke="#3F6FC6" stroke-width="2"/>
        <path d="M0 -7 v7 l5 3" fill="none" stroke="#3F6FC6" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <circle cx="30" cy="30" r="16" fill="#3F6FC6"/><text x="30" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">2</text>
      <text x="20" y="208" font-size="18" font-weight="800" fill="#173A31">按入库时间抓新</text>
      <text x="20" y="238" font-size="13.5" fill="#5F7069">取窗口内全部新入库文献</text>
      <text x="20" y="260" font-size="13.5" fill="#5F7069">几天没跑会自动补窗</text>
      <text x="20" y="282" font-size="13.5" fill="#5F7069">检索式被改写就告警</text>
      <rect x="20" y="304" width="180" height="32" rx="10" fill="#E5EEFB"/>
      <text x="110" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2C56A3">命中 63 · 13 · 18 篇</text>
    </g>
    <use href="#chev" x="517.5" y="220"/>

    <!-- ========== card 3 ========== -->
    <g transform="translate(530 128)">
      <rect width="220" height="352" rx="20" fill="#FFFFFF" filter="url(#card)"/>
      <rect x="10" y="10" width="200" height="164" rx="14" fill="url(#g3)"/>
      <!-- incoming sheets -->
      <use href="#sheet" transform="translate(70 18) rotate(-8) scale(0.75)"/>
      <use href="#sheet" transform="translate(98 14) rotate(5) scale(0.75)"/>
      <!-- funnel -->
      <g filter="url(#soft)">
        <path d="M54 56 L 98 112 L 98 138 Q 108 144 118 138 L 118 112 L 162 56 Z" fill="url(#funnelG)"/>
        <ellipse cx="108" cy="56" rx="54" ry="11" fill="#1E5F4E"/>
        <path d="M64 64 L 100 110" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <!-- ledger book: seen -->
      <g transform="translate(18 88)" filter="url(#soft)">
        <rect width="48" height="58" rx="6" fill="#2E6E5C"/>
        <rect x="6" y="0" width="4" height="58" fill="#1E5F4E"/>
        <rect x="16" y="12" width="24" height="4" rx="2" fill="#BFE6D6"/>
        <path d="M18 30 l6 6 l12 -12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#1E5F4E">已读名单</text>
      <path d="M68 104 q 12 -6 20 -14" fill="none" stroke="#1E5F4E" stroke-width="1.8" stroke-dasharray="2 3"/>
      <!-- outputs -->
      <g transform="translate(140 118)">
        <rect width="62" height="22" rx="11" fill="#2E8A68"/>
        <text x="31" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">收录 18</text>
      </g>
      <g transform="translate(140 146)">
        <rect width="62" height="22" rx="11" fill="#F4B740"/>
        <text x="31" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3B00">顺延 51</text>
      </g>
      <circle cx="30" cy="30" r="16" fill="#1F8A7E"/><text x="30" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">3</text>
      <text x="20" y="208" font-size="18" font-weight="800" fill="#173A31">先去重，再截取</text>
      <text x="20" y="238" font-size="13.5" fill="#5F7069">去重后 87 篇，已读 18 篇跳过</text>
      <text x="20" y="260" font-size="13.5" fill="#5F7069">每词最多收 6 篇新文献</text>
      <text x="20" y="282" font-size="13.5" fill="#5F7069">多出来的顺延，不丢</text>
      <rect x="20" y="304" width="180" height="32" rx="10" fill="#E2F3F1"/>
      <text x="110" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17695F">本期收录 18 篇</text>
    </g>
    <use href="#chev" x="762.5" y="220"/>

    <!-- ========== card 4 ========== -->
    <g transform="translate(775 128)">
      <rect width="220" height="352" rx="20" fill="#FFFFFF" filter="url(#card)"/>
      <rect x="10" y="10" width="200" height="164" rx="14" fill="url(#g4)"/>
      <!-- robot reader -->
      <g transform="translate(70 22)" filter="url(#soft)">
        <line x1="40" y1="0" x2="40" y2="10" stroke="#C4553A" stroke-width="2.5"/>
        <circle cx="40" cy="0" r="4" fill="#F2C14E"/>
        <rect x="8" y="10" width="64" height="46" rx="16" fill="#FFFFFF"/>
        <rect x="16" y="20" width="48" height="26" rx="10" fill="#2A3B36"/>
        <circle cx="31" cy="33" r="4" fill="#8FE3C4"/>
        <circle cx="49" cy="33" r="4" fill="#8FE3C4"/>
        <rect x="2" y="26" width="6" height="14" rx="3" fill="#E7795A"/>
        <rect x="72" y="26" width="6" height="14" rx="3" fill="#E7795A"/>
      </g>
      <!-- trays -->
      <g transform="translate(22 92)">
        <g>
          <path d="M0 18 h52 l-5 24 h-42 z" fill="#E2553F"/>
          <use href="#sheet" transform="translate(12 0) scale(0.7)"/>
          <path d="M0 18 h52 l-5 24 h-42 z" fill="#E2553F" fill-opacity="0.92"/>
          <text x="26" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">3</text>
          <text x="26" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9A3422">必读</text>
        </g>
        <g transform="translate(62 0)">
          <use href="#sheet" transform="translate(8 -4) rotate(-6) scale(0.7)"/>
          <use href="#sheet" transform="translate(18 0) rotate(5) scale(0.7)"/>
          <path d="M0 18 h52 l-5 24 h-42 z" fill="#E7AE2B" fill-opacity="0.95"/>
          <text x="26" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">7</text>
          <text x="26" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8A6206">扫一眼</text>
        </g>
        <g transform="translate(124 0)">
          <use href="#sheet" transform="translate(8 -2) rotate(-8) scale(0.7)"/>
          <use href="#sheet" transform="translate(18 2) rotate(7) scale(0.7)"/>
          <path d="M0 18 h52 l-5 24 h-42 z" fill="#A5B1AC" fill-opacity="0.95"/>
          <text x="26" y="36" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">8</text>
          <text x="26" y="62" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5D6A65">可跳过</text>
        </g>
      </g>
      <circle cx="30" cy="30" r="16" fill="#E0603F"/><text x="30" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">4</text>
      <text x="20" y="208" font-size="18" font-weight="800" fill="#173A31">Agent 分档写导读</text>
      <text x="20" y="238" font-size="13.5" fill="#5F7069">对照研究方向分进三档</text>
      <text x="20" y="260" font-size="13.5" fill="#5F7069">前两档各配一句中文导读</text>
      <text x="20" y="282" font-size="13.5" fill="#5F7069">拿不准就放高一档</text>
      <rect x="20" y="304" width="180" height="32" rx="10" fill="#FDEBE3"/>
      <text x="110" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B44A2E">必读 3 · 扫一眼 7 · 跳过 8</text>
    </g>
    <use href="#chev" x="1007.5" y="220"/>

    <!-- ========== card 5 ========== -->
    <g transform="translate(1020 128)">
      <rect width="220" height="352" rx="20" fill="#FFFFFF" filter="url(#card)"/>
      <rect x="10" y="10" width="200" height="164" rx="14" fill="url(#g5)"/>
      <!-- digest page -->
      <g transform="translate(46 30)" filter="url(#soft)">
        <rect width="92" height="120" rx="8" fill="#FFFFFF"/>
        <rect width="92" height="22" rx="8" fill="#E0603F"/>
        <rect y="12" width="92" height="10" fill="#E0603F"/>
        <rect x="10" y="7" width="40" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.85"/>
        <circle cx="16" cy="36" r="4" fill="#E2553F"/><rect x="25" y="33" width="56" height="6" rx="3" fill="#EBC4B8"/>
        <rect x="25" y="44" width="44" height="5" rx="2.5" fill="#EEDDD7"/>
        <circle cx="16" cy="62" r="4" fill="#E7AE2B"/><rect x="25" y="59" width="56" height="6" rx="3" fill="#EBDDB0"/>
        <rect x="25" y="70" width="40" height="5" rx="2.5" fill="#F0E7CC"/>
        <circle cx="16" cy="88" r="4" fill="#A5B1AC"/><rect x="25" y="85" width="50" height="6" rx="3" fill="#DDE2DF"/>
      </g>
      <!-- shield -->
      <g transform="translate(124 70)" filter="url(#soft)">
        <path d="M30 0 L58 10 V36 C58 56 44 68 30 74 C16 68 2 56 2 36 V10 Z" fill="url(#shieldG)"/>
        <path d="M18 36 l8 8 l16 -16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="30" cy="30" r="16" fill="#6A52C4"/><text x="30" y="35.5" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">5</text>
      <text x="20" y="208" font-size="18" font-weight="800" fill="#173A31">校验通过才落盘</text>
      <text x="20" y="238" font-size="13.5" fill="#5F7069">照抄摘要连续 ≥25 词：拒绝</text>
      <text x="20" y="260" font-size="13.5" fill="#5F7069">已撤稿列为必读：拒绝</text>
      <text x="20" y="282" font-size="13.5" fill="#5F7069">写成功后才记为已读</text>
      <rect x="20" y="304" width="180" height="32" rx="10" fill="#EFEAFB"/>
      <text x="110" y="325" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5640A8">日报 + 已读 18 篇</text>
    </g>

    <!-- ========== feedback loops ========== -->
    <!-- deferred: card3 -> card2 -->
    <path d="M620 484 C 620 552, 410 552, 410 490" fill="none" stroke="#E7A91F" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M403 499 l7 -10 l7 10" fill="none" stroke="#E7A91F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(386 552)">
      <rect width="258" height="46" rx="14" fill="#FFF6DD" stroke="#F2D58A"/>
      <circle cx="22" cy="23" r="10" fill="#F4B740"/>
      <path d="M17 23 h10 M23 18 l4 5 l-4 5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="20" font-size="13.5" font-weight="700" fill="#6B4A00">顺延的 51 篇不记已读</text>
      <text x="40" y="37" font-size="12.5" fill="#8C6D2B">下次运行仍在窗口内，排队再来</text>
    </g>
    <!-- seen write-back: card5 -> card3 -->
    <path d="M1130 484 C 1130 600, 680 600, 680 490" fill="none" stroke="#2E8A68" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M673 499 l7 -10 l7 10" fill="none" stroke="#2E8A68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(790 574)">
      <rect width="282" height="46" rx="14" fill="#E6F5EE" stroke="#A9DCC6"/>
      <circle cx="22" cy="23" r="10" fill="#2E8A68"/>
      <path d="M17 23 l3.5 3.5 l7 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="20" font-size="13.5" font-weight="700" fill="#1F5E49">本期 18 篇写回已读名单</text>
      <text x="40" y="37" font-size="12.5" fill="#4F7A69">下次再跑，这些不会再出现</text>
    </g>

    <!-- legend / footnote -->
    <g transform="translate(40 652)" font-size="12.5" fill="#6B7A74">
      <rect x="0" y="-10" width="18" height="4" rx="2" fill="#2E8A68"/>
      <text x="26" y="-3">已读名单回写</text>
      <rect x="118" y="-10" width="18" height="4" rx="2" fill="#E7A91F"/>
      <text x="144" y="-3">顺延队列</text>
      <text x="230" y="-3">· 图中数字均来自仓库里保存的一次真实 PubMed 运行（evals/runs_v2）</text>
    </g>
  </g>
</svg>
